services:
  postgres:
    image: postgres:16-alpine
    container_name: conge_postgres
    environment:
      POSTGRES_USER: conge
      POSTGRES_PASSWORD: conge123
      POSTGRES_DB: congedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conge -d congedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conge_app
    environment:
      DATABASE_URL: postgresql://conge:conge123@postgres:5432/congedb
      # Must be >=32 chars and not placeholder-like when NODE_ENV=production (see docker/entrypoint.sh)
      JWT_SECRET: local-docker-compose-jwt-secret-minimum-32-chars-x
      NODE_ENV: production
      # Optional: fail if DATABASE_URL host does not match (compose service name for DB)
      EXPECTED_DB_HOST: postgres
      # Optional override only for controlled deploys with destructive pending SQL (default: unset = block)
      # ALLOW_DESTRUCTIVE_MIGRATIONS: "true"
      # Optional: pg_dump full DB backup before migration scan (default: unset = skip)
      # AUTO_BACKUP_BEFORE_MIGRATE: "true"
    ports:
      - "3001:3000"
    volumes:
      - uploads_data:/app/public/uploads
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  backups_data:
