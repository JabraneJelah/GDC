version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: conge_postgres
    environment:
      POSTGRES_USER: conge
      POSTGRES_PASSWORD: conge123
      POSTGRES_DB: congedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conge -d congedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conge_app
    environment:
      - DATABASE_URL=postgresql://conge:conge123@postgres:5432/congedb
      - JWT_SECRET=dev-secret-key
      - NODE_ENV=production
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: node server.js

volumes:
  postgres_data:

